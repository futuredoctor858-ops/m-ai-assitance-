
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <title>Myra - Your AI Soulmate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0a;
        color: white;
      }
      .glass-morphism {
        background: rgba(255, 20, 147, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 20, 147, 0.1);
      }
      .glow-romantic {
        box-shadow: 0 0 25px rgba(236, 72, 153, 0.2);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(236, 72, 153, 0.2);
        border-radius: 10px;
      }

      /* Romantic Floating Hearts Animation */
      @keyframes float-heart {
        0% {
          transform: translateY(0) scale(1) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) scale(1.5) rotate(20deg);
          opacity: 0;
        }
      }
      .heart-particle {
        position: absolute;
        pointer-events: none;
        animation: float-heart 1.5s ease-out forwards;
        color: #ec4899;
        z-index: 50;
      }

      /* Soft Pulse for romantic messages */
      @keyframes soft-pulse {
        0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.1); }
        50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.3); }
      }
      .romantic-pulse {
        animation: soft-pulse 3s infinite ease-in-out;
        border-color: rgba(236, 72, 153, 0.3) !important;
      }

      /* Entry animation for messages */
      .message-enter {
        animation: message-in 0.3s ease-out;
      }
      @keyframes message-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{

  }
}
</script>
</head>

  </body>
</html>
